<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface-0);padding:24px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:64px;height:64px;background:var(--surface-1);border:1px solid var(--border-default);}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head><body>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:var(--r-xs)"></div><div class="lbl">r-xs</div><div class="px">4</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-sm)"></div><div class="lbl">r-sm</div><div class="px">6</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-md)"></div><div class="lbl">r-md</div><div class="px">8</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-lg)"></div><div class="lbl">r-lg</div><div class="px">12</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-xl)"></div><div class="lbl">r-xl</div><div class="px">20</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-full)"></div><div class="lbl">r-full</div><div class="px">∞</div></div>
  </div>
</body></html>
