<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface-0);}
  .wrap{padding:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .pill{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--border-subtle);}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .name{font-size:13px;font-weight:500;color:var(--fg-1);font-family:var(--font-sans);flex:1;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
  .demo{padding:8px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:500;font-family:var(--font-sans);}
</style></head><body><div class="wrap">
  <div class="pill"><div class="dot" style="background:var(--success)"></div><span class="name">success</span><span class="demo" style="background:var(--success-soft);color:var(--success)">Paid</span></div>
  <div class="pill"><div class="dot" style="background:var(--warning)"></div><span class="name">warning</span><span class="demo" style="background:var(--warning-soft);color:var(--warning)">Due soon</span></div>
  <div class="pill"><div class="dot" style="background:var(--danger)"></div><span class="name">danger</span><span class="demo" style="background:var(--danger-soft);color:var(--danger)">Overdue</span></div>
  <div class="pill"><div class="dot" style="background:var(--info)"></div><span class="name">info</span><span class="demo" style="background:var(--info-soft);color:var(--info)">Scheduled</span></div>
</div></body></html>
