<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface-0);}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--border-subtle);}
  .chip{width:56px;height:40px;border-radius:var(--r-sm);border:1px solid var(--border-subtle);flex-shrink:0;}
  .meta{display:flex;flex-direction:column;gap:2px;flex:1;}
  .name{font-size:13px;font-weight:500;color:var(--fg-1);font-family:var(--font-sans);}
  .desc{font-size:12px;color:var(--fg-3);font-family:var(--font-sans);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
</style></head><body><div class="wrap">
  <div class="row"><div class="chip" style="background:var(--surface-0)"></div><div class="meta"><div class="name">surface-0</div><div class="desc">Page background</div></div><div class="hex">#0B0C0E</div></div>
  <div class="row"><div class="chip" style="background:var(--surface-1)"></div><div class="meta"><div class="name">surface-1</div><div class="desc">Cards, panels</div></div><div class="hex">#15171A</div></div>
  <div class="row"><div class="chip" style="background:var(--surface-2)"></div><div class="meta"><div class="name">surface-2</div><div class="desc">Popovers, hover state</div></div><div class="hex">#1D2025</div></div>
  <div class="row"><div class="chip" style="background:var(--surface-3)"></div><div class="meta"><div class="name">surface-3</div><div class="desc">Modals, top of stack</div></div><div class="hex">#262A30</div></div>
  <div class="row"><div class="chip" style="background:var(--surface-inset)"></div><div class="meta"><div class="name">surface-inset</div><div class="desc">Inputs, recessed wells</div></div><div class="hex">#0E1013</div></div>
</div></body></html>
