<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Hearth — Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body {
    margin: 0;
    background: var(--surface-0);
    font-family: var(--font-sans);
    color: var(--fg-1);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page {
    padding: 32px 40px;
    box-sizing: border-box;
  }
  .header {
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
    margin-bottom: 6px;
  }
  .title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--fg-1);
    margin: 0;
  }
  .sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--fg-2);
  }
  .wrap {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .swatch {
    display: flex;
    flex-direction: column;
    gap: 10px;
    break-inside: avoid;
  }
  .chip {
    height: 100px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
  }
  .meta { display: flex; flex-direction: column; gap: 3px; }
  .name { font-size: 13px; font-weight: 500; color: var(--fg-1); }
  .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }

  @page {
    size: landscape;
    margin: 0.5cm;
  }
  @media print {
    html, body { background: var(--surface-0) !important; }
    .page { padding: 16px 20px; }
    .chip { height: 84px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="eyebrow">Hearth · Design System</div>
    <h1 class="title">Brand Colors</h1>
    <div class="sub">Deep blue scale · brand-400 is the primary brand color</div>
  </div>

  <div class="wrap">
    <div class="swatch"><div class="chip" style="background:#E8EEFB"></div><div class="meta"><div class="name">brand-50</div><div class="hex">#E8EEFB</div></div></div>
    <div class="swatch"><div class="chip" style="background:#C9D6F4"></div><div class="meta"><div class="name">brand-100</div><div class="hex">#C9D6F4</div></div></div>
    <div class="swatch"><div class="chip" style="background:#8AA6E6"></div><div class="meta"><div class="name">brand-200</div><div class="hex">#8AA6E6</div></div></div>
    <div class="swatch"><div class="chip" style="background:#5A7FD4"></div><div class="meta"><div class="name">brand-300</div><div class="hex">#5A7FD4</div></div></div>
    <div class="swatch"><div class="chip" style="background:#3A5FB8;outline:1px solid #3A5FB8;outline-offset:2px;"></div><div class="meta"><div class="name">brand-400 · primary</div><div class="hex">#3A5FB8</div></div></div>
    <div class="swatch"><div class="chip" style="background:#2A4795"></div><div class="meta"><div class="name">brand-500</div><div class="hex">#2A4795</div></div></div>
    <div class="swatch"><div class="chip" style="background:#1E3470"></div><div class="meta"><div class="name">brand-600</div><div class="hex">#1E3470</div></div></div>
    <div class="swatch"><div class="chip" style="background:#14224C"></div><div class="meta"><div class="name">brand-700</div><div class="hex">#14224C</div></div></div>
  </div>
</div>

<script>
  (async () => {
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (e) {}
    }
    setTimeout(() => window.print(), 500);
  })();
</script>
</body>
</html>
