<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;background:var(--surface-0);padding:0;font-family:var(--font-sans);}
  .nav{display:flex;gap:4px;padding:16px;background:var(--surface-1);border-right:1px solid var(--border-subtle);width:100%;flex-direction:column;}
  .item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-md);font-size:14px;font-weight:500;color:var(--fg-2);cursor:pointer;}
  .item [data-lucide]{width:18px;height:18px;stroke-width:1.75;}
  .item:hover{background:var(--surface-2);color:var(--fg-1);}
  .item.active{background:var(--surface-2);color:var(--fg-1);}
  .item.active [data-lucide]{color:var(--brand);}
  .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);background:var(--surface-3);padding:2px 7px;border-radius:var(--r-full);}
  .item.active .count{color:var(--ember-200);background:var(--ember-700);}
</style></head><body><div class="nav">
  <div class="item active"><i data-lucide="layout-dashboard"></i>Dashboard</div>
  <div class="item"><i data-lucide="receipt"></i>Bills<span class="count">7</span></div>
  <div class="item"><i data-lucide="calendar"></i>Calendar</div>
  <div class="item"><i data-lucide="wallet"></i>Accounts</div>
  <div class="item"><i data-lucide="bell"></i>Reminders<span class="count">2</span></div>
  <div class="item"><i data-lucide="settings"></i>Settings</div>
<script>lucide.createIcons();</script>
</div></body></html>
