<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;background:var(--surface-0);padding:24px;font-family:var(--font-sans);}
  .card{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px;display:flex;align-items:center;gap:16px;}
  .icon-wrap{width:44px;height:44px;border-radius:var(--r-md);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--fg-2);}
  .icon-wrap [data-lucide]{width:20px;height:20px;stroke-width:1.5;}
  .meta{flex:1;display:flex;flex-direction:column;gap:2px;}
  .name{font-size:15px;font-weight:500;color:var(--fg-1);}
  .sub{font-size:12px;color:var(--fg-3);}
  .amt{font-family:var(--font-mono);font-size:18px;font-weight:500;color:var(--fg-1);font-feature-settings:'tnum' 1;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--r-full);font-size:11px;font-weight:500;background:var(--warning-soft);color:var(--warning);}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--warning);}
</style></head><body>
  <div class="card">
    <div class="icon-wrap"><i data-lucide="zap"></i></div>
    <div class="meta">
      <div class="name">Pacific Power</div>
      <div class="sub">Electricity · Auto-pay</div>
    </div>
    <span class="badge"><span class="dot"></span>Due in 3 days</span>
    <span class="amt">$ 142.30</span>
  </div>
<script>lucide.createIcons();</script>
</body></html>
