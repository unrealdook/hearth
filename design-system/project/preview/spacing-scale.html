<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface-0);padding:24px;}
  .grid{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;align-items:end;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{width:100%;background:var(--ember-400);border-radius:2px;}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
  .px{font-family:var(--font-mono);font-size:9px;color:var(--fg-3);}
</style></head><body>
  <div class="grid">
    <div class="cell"><div class="bar" style="height:4px"></div><div class="lbl">s-1</div><div class="px">4</div></div>
    <div class="cell"><div class="bar" style="height:8px"></div><div class="lbl">s-2</div><div class="px">8</div></div>
    <div class="cell"><div class="bar" style="height:12px"></div><div class="lbl">s-3</div><div class="px">12</div></div>
    <div class="cell"><div class="bar" style="height:16px"></div><div class="lbl">s-4</div><div class="px">16</div></div>
    <div class="cell"><div class="bar" style="height:20px"></div><div class="lbl">s-5</div><div class="px">20</div></div>
    <div class="cell"><div class="bar" style="height:24px"></div><div class="lbl">s-6</div><div class="px">24</div></div>
    <div class="cell"><div class="bar" style="height:32px"></div><div class="lbl">s-8</div><div class="px">32</div></div>
    <div class="cell"><div class="bar" style="height:40px"></div><div class="lbl">s-10</div><div class="px">40</div></div>
    <div class="cell"><div class="bar" style="height:56px"></div><div class="lbl">s-14</div><div class="px">56</div></div>
    <div class="cell"><div class="bar" style="height:72px"></div><div class="lbl">s-18</div><div class="px">72</div></div>
    <div class="cell"><div class="bar" style="height:96px"></div><div class="lbl">s-24</div><div class="px">96</div></div>
  </div>
</body></html>
