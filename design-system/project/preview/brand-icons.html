<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;background:var(--surface-0);padding:24px;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:18px;justify-items:center;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg-2);}
  .cell [data-lucide]{width:22px;height:22px;stroke-width:1.5;}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
</style></head><body><div class="grid">
  <div class="cell"><i data-lucide="home"></i><span class="lbl">home</span></div>
  <div class="cell"><i data-lucide="receipt"></i><span class="lbl">receipt</span></div>
  <div class="cell"><i data-lucide="calendar"></i><span class="lbl">calendar</span></div>
  <div class="cell"><i data-lucide="bell"></i><span class="lbl">bell</span></div>
  <div class="cell"><i data-lucide="wallet"></i><span class="lbl">wallet</span></div>
  <div class="cell"><i data-lucide="check"></i><span class="lbl">check</span></div>
  <div class="cell"><i data-lucide="clock"></i><span class="lbl">clock</span></div>
  <div class="cell"><i data-lucide="alert-triangle"></i><span class="lbl">alert</span></div>
  <div class="cell"><i data-lucide="plus"></i><span class="lbl">plus</span></div>
  <div class="cell"><i data-lucide="search"></i><span class="lbl">search</span></div>
  <div class="cell"><i data-lucide="settings"></i><span class="lbl">settings</span></div>
  <div class="cell"><i data-lucide="zap"></i><span class="lbl">zap</span></div>
  <div class="cell"><i data-lucide="wifi"></i><span class="lbl">wifi</span></div>
  <div class="cell"><i data-lucide="droplet"></i><span class="lbl">droplet</span></div>
  <div class="cell"><i data-lucide="flame"></i><span class="lbl">flame</span></div>
  <div class="cell"><i data-lucide="more-horizontal"></i><span class="lbl">more</span></div>
<script>lucide.createIcons();</script>
</div></body></html>
