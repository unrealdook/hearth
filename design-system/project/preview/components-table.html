<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;background:var(--surface-0);padding:0;font-family:var(--font-sans);}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:12px 16px;text-align:left;font-size:13px;border-bottom:1px solid var(--border-subtle);}
  th{font-weight:500;color:var(--fg-3);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;}
  td{color:var(--fg-1);}
  td.amt{font-family:var(--font-mono);text-align:right;font-feature-settings:'tnum' 1;}
  .vendor{display:flex;align-items:center;gap:10px;}
  .vicon{width:28px;height:28px;border-radius:var(--r-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--fg-2);}
  .vicon [data-lucide]{width:14px;height:14px;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:500;}
  .dot{width:5px;height:5px;border-radius:50%;}
  .due{background:var(--warning-soft);color:var(--warning);} .due .dot{background:var(--warning);}
  .paid{background:var(--success-soft);color:var(--success);} .paid .dot{background:var(--success);}
  .sched{background:var(--info-soft);color:var(--info);} .sched .dot{background:var(--info);}
</style></head><body>
<table>
  <thead><tr><th>Bill</th><th>Status</th><th>Due</th><th style="text-align:right">Amount</th></tr></thead>
  <tbody>
    <tr><td><div class="vendor"><div class="vicon"><i data-lucide="zap"></i></div>Pacific Power</div></td><td><span class="badge due"><span class="dot"></span>Due in 3 days</span></td><td>May 14</td><td class="amt">$ 142.30</td></tr>
    <tr><td><div class="vendor"><div class="vicon"><i data-lucide="wifi"></i></div>Comcast</div></td><td><span class="badge sched"><span class="dot"></span>Scheduled</span></td><td>May 18</td><td class="amt">$ 89.00</td></tr>
    <tr><td><div class="vendor"><div class="vicon"><i data-lucide="droplet"></i></div>City Water</div></td><td><span class="badge paid"><span class="dot"></span>Paid</span></td><td>May 02</td><td class="amt">$ 47.55</td></tr>
  </tbody>
</table>
<script>lucide.createIcons();</script>
</body></html>
