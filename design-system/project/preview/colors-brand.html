<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface-0);font-family:var(--font-sans);}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .swatch{display:flex;flex-direction:column;gap:8px;}
  .chip{height:64px;border-radius:var(--r-md);border:1px solid var(--border-subtle);}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .name{font-size:13px;font-weight:500;color:var(--fg-1);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
</style></head><body><div class="wrap">
  <div class="swatch"><div class="chip" style="background:#E8EEFB"></div><div class="meta"><div class="name">brand-50</div><div class="hex">#E8EEFB</div></div></div>
  <div class="swatch"><div class="chip" style="background:#C9D6F4"></div><div class="meta"><div class="name">brand-100</div><div class="hex">#C9D6F4</div></div></div>
  <div class="swatch"><div class="chip" style="background:#8AA6E6"></div><div class="meta"><div class="name">brand-200</div><div class="hex">#8AA6E6</div></div></div>
  <div class="swatch"><div class="chip" style="background:#5A7FD4"></div><div class="meta"><div class="name">brand-300</div><div class="hex">#5A7FD4</div></div></div>
  <div class="swatch"><div class="chip" style="background:#3A5FB8;outline:1px solid var(--brand);outline-offset:2px;"></div><div class="meta"><div class="name">brand-400 · primary</div><div class="hex">#3A5FB8</div></div></div>
  <div class="swatch"><div class="chip" style="background:#2A4795"></div><div class="meta"><div class="name">brand-500</div><div class="hex">#2A4795</div></div></div>
  <div class="swatch"><div class="chip" style="background:#1E3470"></div><div class="meta"><div class="name">brand-600</div><div class="hex">#1E3470</div></div></div>
  <div class="swatch"><div class="chip" style="background:#14224C"></div><div class="meta"><div class="name">brand-700</div><div class="hex">#14224C</div></div></div>
</div></body></html>
