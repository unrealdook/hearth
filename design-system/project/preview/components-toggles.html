<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface-0);padding:24px;font-family:var(--font-sans);}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .toggle-row{display:flex;align-items:center;gap:14px;padding:8px 0;}
  .switch{width:36px;height:20px;border-radius:var(--r-full);background:var(--surface-3);position:relative;cursor:pointer;transition:background var(--dur-micro) var(--ease);flex-shrink:0;}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg-2);transition:transform var(--dur-micro) var(--ease),background var(--dur-micro) var(--ease);}
  .switch.on{background:var(--brand);}
  .switch.on::after{transform:translateX(16px);background:var(--brand-fg);}
  .lbl{flex:1;font-size:14px;color:var(--fg-1);}
  .desc{font-size:12px;color:var(--fg-3);margin-top:2px;}
  .check{width:18px;height:18px;border-radius:var(--r-xs);border:1.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .check.on{background:var(--brand);border-color:var(--brand);}
  .check.on::after{content:'';width:10px;height:6px;border-left:2px solid var(--brand-fg);border-bottom:2px solid var(--brand-fg);transform:rotate(-45deg) translate(1px,-1px);}
  .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);position:relative;flex-shrink:0;cursor:pointer;}
  .radio.on{border-color:var(--brand);}
  .radio.on::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--brand);}
</style></head><body><div class="stack">
  <div class="toggle-row"><div class="switch on"></div><div><div class="lbl">Auto-pay</div><div class="desc">Pay 2 days before due</div></div></div>
  <div class="toggle-row"><div class="switch"></div><div><div class="lbl">Email reminders</div><div class="desc">Off</div></div></div>
  <div class="toggle-row"><div class="check on"></div><span class="lbl">Send a receipt to my email</span></div>
  <div class="toggle-row"><div class="check"></div><span class="lbl">Add to calendar</span></div>
  <div class="toggle-row"><div class="radio on"></div><span class="lbl">Pay from Chase ··· 4421</span></div>
  <div class="toggle-row"><div class="radio"></div><span class="lbl">Pay from Schwab ··· 0892</span></div>
</div></body></html>
