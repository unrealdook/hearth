<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface-0);}
  .wrap{padding:24px;display:flex;flex-direction:column;gap:0;}
  .row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border-subtle);}
  .row:last-child{border-bottom:none;}
  .swatch{width:48px;height:48px;border-radius:var(--r-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:16px;font-weight:600;}
  .info{flex:1;display:flex;flex-direction:column;gap:2px;}
  .name{font-size:14px;font-weight:500;color:var(--fg-1);font-family:var(--font-sans);}
  .sample{font-size:14px;color:var(--fg-1);font-family:var(--font-sans);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);}
</style></head><body><div class="wrap">
  <div class="row"><div class="swatch" style="background:var(--surface-1);color:var(--fg-1);">Aa</div><div class="info"><div class="name">fg-1 · primary text</div></div><div class="hex">#F2F3F5</div></div>
  <div class="row"><div class="swatch" style="background:var(--surface-1);color:var(--fg-2);">Aa</div><div class="info"><div class="name">fg-2 · secondary, icons</div></div><div class="hex">#A8ADB7</div></div>
  <div class="row"><div class="swatch" style="background:var(--surface-1);color:var(--fg-3);">Aa</div><div class="info"><div class="name">fg-3 · tertiary, captions</div></div><div class="hex">#6B7280</div></div>
  <div class="row"><div class="swatch" style="background:var(--surface-1);color:var(--fg-4);">Aa</div><div class="info"><div class="name">fg-4 · disabled, hint</div></div><div class="hex">#3F4651</div></div>
</div></body></html>
